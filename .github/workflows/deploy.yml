name: Deploy to pimedia

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger signed deploy webhook
        env:
          SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
        run: |
          if [ -z "$SECRET" ]; then
            echo "::error::DEPLOY_WEBHOOK_SECRET is not set in repo Settings → Secrets and variables → Actions"
            exit 1
          fi
          body='{"ref":"${{ github.ref }}","sha":"${{ github.sha }}"}'
          sig="sha256=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$SECRET" | sed 's/^.* //')"
          curl -fsS -X POST \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: $sig" \
            --data "$body" \
            https://deploy.frc8726.org/hooks/deploy-website
