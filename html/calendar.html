<!DOCTYPE html>
<!-- ================================================================
     CALENDAR PAGE  (frc8726.org/calendar)
     ----------------------------------------------------------------
     The calendar is the team Google Calendar (urbanahsrobotics@gmail.com)
     shown in an <iframe>. To add events, add them in Google Calendar, not here.

     HOW THIS PAGE IS BUILT
       <head>       Page title, link-preview info, and the styles for this page.
       <style>      Styles used ONLY on this page. Site-wide styles (colors,
                    fonts, header, footer, buttons, cards) are in assets/style.css.
       Header/footer  Shared by every page. Edit partials/header.html and
                    partials/footer.html, not this file.
       <main>       The page content, split into sections marked with ══ lines.

     Preview your changes: see "Previewing" in README.md.
     ================================================================ -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Page title: shows in the browser tab and Google results. -->
  <title>Calendar | CryptoHawks FRC 8726</title>
  <meta name="description" content="Stay up to date with CryptoHawks FRC 8726 — meeting schedules, competitions, outreach events, and more." />
  <!-- Link preview: what people see when this page is shared in a text,
       Discord, Instagram, etc. Keep og:title/og:description matching above. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="CryptoHawks FRC 8726" />
  <meta property="og:title" content="Calendar | CryptoHawks FRC 8726" />
  <meta property="og:description" content="Stay up to date with CryptoHawks FRC 8726 — meeting schedules, competitions, outreach events, and more." />
  <meta property="og:url" content="https://frc8726.org/calendar" />
  <meta property="og:image" content="https://frc8726.org/assets/images/og-image.jpg" />
  <meta property="og:image:alt" content="CryptoHawks students holding up 8726 signs" />
  <meta name="twitter:card" content="summary_large_image" />
  <!-- Site-wide styles (shared by every page) -->
  <link rel="stylesheet" href="assets/style.css" />
  <link rel="icon" href="assets/images/hawk-logo.png" type="image/png" />

  <!-- Styles for THIS page only -->
  <style>
    /* Intro text above the calendar */
    .calendar-blurb {
      padding: 3rem 0 2rem;
    }

    .calendar-blurb p {
      font-size: 1.05rem;
      color: var(--dark-gray);
      max-width: 60ch;
    }

    /* Box with a thin border around the Google Calendar */
    .calendar-embed-wrapper {
      border: 1px solid #e2e2ea;
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 5rem;
    }

    /* The calendar itself. Change height to make it taller/shorter. */
    .calendar-embed-wrapper iframe {
      width: 100%;
      height: 700px;
      border: none;
      display: block;
    }


    /* Shorter calendar on phones */
    @media (max-width: 600px) {
      .calendar-embed-wrapper iframe {
        height: 480px;
      }
    }
  </style>
</head>
<body>

  <!-- ══ HEADER ══════════════════════════════════════════ -->
  <!-- Shared header (logo + menu). To change it, edit partials/header.html -->
  <!--#include virtual="/partials/header.html" -->

  <!-- ══ PAGE HERO ════════════════════════════════════════ -->
  <section class="page-hero">
    <div class="container">
      <p class="page-hero__label">Stay in the loop</p>
      <h1 class="page-hero__title">Team Calendar</h1>
    </div>
  </section>

  <main>
    <section class="calendar-blurb">
      <div class="container">
        <p>
          Everything on the CryptoHawks schedule — team meetings, competitions,
          outreach events, and key deadlines — lives here. Check back regularly
          or add our calendar to your own Google Calendar to stay up to date.
        </p>
      </div>
    </section>

    <div class="container">
      <div class="calendar-embed-wrapper">

        <iframe
          src="https://calendar.google.com/calendar/embed?src=urbanahsrobotics%40gmail.com&ctz=America%2FNew_York&mode=MONTH&showTitle=0&showPrint=0&showCalendars=0"
          style="border: 0"
          width="100%"
          height="700"
          frameborder="0"
          scrolling="no">
        </iframe>

      </div>
    </div>
  </main>

  <!-- ══ FOOTER ═══════════════════════════════════════════ -->
  <!-- Shared footer. To change it, edit partials/footer.html -->
  <!--#include virtual="/partials/footer.html" -->


</body>
</html>
